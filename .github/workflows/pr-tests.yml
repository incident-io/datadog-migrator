name: PR Tests

on:
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # npm keeps every canary build; setup-bun can only fetch the latest one
      - name: Install Bun
        run: npm install -g bun@$(cat .bun-version)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Check types
        run: bun check

      - name: Lint
        run: bun lint

      - name: Check formatting
        run: bun fmt --check src
